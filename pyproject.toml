[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iotids"
version = "0.1.0"
description = "Self-supervised, drift-aware zero-day intrusion detection for IoT networks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "T. Kugashanth" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "river>=0.21",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.50", "plotly>=5.18"]
dev = ["pytest>=7.4", "ruff>=0.4", "nbformat", "nbconvert", "ipykernel"]
tracking = ["mlflow>=2.9"]

[project.scripts]
iotids = "iotids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
